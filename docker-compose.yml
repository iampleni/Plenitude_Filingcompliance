services:
  db:
    image: postgres:16-alpine
    container_name: taxdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taxdesk
      POSTGRES_PASSWORD: taxdesk
      POSTGRES_DB: taxdesk
    ports:
      - "5432:5432"
    volumes:
      - taxdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taxdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  taxdesk_pgdata:
